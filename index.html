<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة يُسر للتمويل السريع</title>

  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Cairo', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <div id="app">
    <!-- Navbar / Header -->
    <header class="bg-teal-700 text-white sticky top-0 z-50 shadow-md">
      <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-wallet text-2xl text-teal-300"></i>
          <div>
            <h1 class="font-bold text-lg leading-tight">منصة يُسر للتمويل السريع</h1>
            <p class="text-xs text-teal-100">Frontend Demo</p>
          </div>
        </div>

        <button @click="installPWA" class="bg-teal-600 hover:bg-teal-500 text-xs px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5 border border-teal-400 transition-all">
          <i class="fa-solid fa-download"></i>
          <span>تثبيت كـ App</span>
        </button>
      </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-4 space-y-5">
      
      <!-- Loading State Banner -->
      <div v-if="isLoading" class="text-center py-10 bg-white rounded-2xl shadow-sm border">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-teal-600 block mb-2"></i>
        <p class="text-xs text-slate-500 font-bold">جاري تحميل شرائح التمويل المتاحة  ...</p>
      </div>

      <!-- Main Content (Shows when data is loaded) -->
      <template v-else-if="tiers.length > 0">
        <!-- Category Selection -->
        <div class="glass-card rounded-2xl p-4 shadow-sm">
          <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-teal-600"></i>
            اختر شريحة التمويل المطلوبة
          </h2>
          
          <div class="grid grid-cols-5 gap-2">
            <button 
              v-for="item in tiers" 
              :key="item.amount"
              @click="selectedTier = item"
              :class="[
                'py-2 px-1 rounded-xl text-center transition-all border font-bold text-xs',
                selectedTier.amount === item.amount 
                  ? 'bg-teal-600 text-white border-teal-600 shadow-sm' 
                  : 'bg-white text-slate-600 border-slate-200 hover:border-teal-300'
              ]"
            >
              <div>{{ item.amount }}</div>
              <div class="text-[10px] font-normal opacity-80">ريال</div>
            </button>
          </div>
        </div>

        <!-- Financial Calculation Card -->
        <div class="glass-card rounded-2xl p-5 shadow-sm space-y-4">
          <div class="flex justify-between items-center border-b pb-3 border-slate-100">
            <div>
              <span class="text-xs text-slate-500 block">شريحة التمويل</span>
              <span class="text-xl font-extrabold text-teal-700">{{ selectedTier.amount || 0 }} ريال</span>
            </div>
            <div class="text-left">
              <span class="text-xs text-slate-500 block">كلفة الآجل القصوى الثابتة</span>
              <span class="text-base font-bold text-slate-700">{{ formatMoney(selectedTier.totalCost) }} ريال</span>
            </div>
          </div>

          <!-- Breakdown Grid -->
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <span class="text-slate-500 block mb-1">القسط الشامل الأول (يوم 27)</span>
              <span class="font-bold text-slate-800 text-sm">{{ formatMoney(selectedTier.firstInstallment) }} ريال</span>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              <span class="text-slate-500 block mb-1">الأقساط اللاحقة (27 شهرياً)</span>
              <span class="font-bold text-slate-800 text-sm">{{ selectedTier.subsequentInstallments }}</span>
            </div>
          </div>

          <!-- Fees Detail -->
          <div class="bg-teal-50/60 rounded-xl p-3 text-xs space-y-1.5 border border-teal-100">
            <div class="flex justify-between text-teal-900">
              <span>رسوم السند التنفيذي النظامية:</span>
              <span class="font-bold">65.00 ريال</span>
            </div>
            <div class="flex justify-between text-teal-900">
              <span>جدولة الأقساط + الضريبة:</span>
              <span class="font-bold">مشملة معالجة تلقائية</span>
            </div>
            <div class="flex justify-between text-teal-900">
              <span>موعد السداد المعتمد:</span>
              <span class="font-bold text-teal-700">يوم 27 من كل شهر ميلادي</span>
            </div>
          </div>

          <!-- Early Payment Toggle -->
          <div class="border-t pt-3 border-slate-100">
            <div class="flex items-center justify-between">
              <label for="earlyPay" class="text-xs font-bold text-slate-700 flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="earlyPay" v-model="isEarlySettlement" class="accent-teal-600 rounded">
                تطبيق خصم التعجيل (السداد المبكر)
              </label>
              <span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">خصم 15%</span>
            </div>

            <div v-if="isEarlySettlement" class="mt-3 bg-emerald-50 border border-emerald-200 text-emerald-900 p-3 rounded-xl text-xs space-y-1">
              <div class="flex justify-between font-medium">
                <span>خصم تعجيل السداد (15%):</span>
                <span class="text-emerald-700 font-bold">- {{ discountAmount }} ريال</span>
              </div>
              <div class="flex justify-between text-sm font-extrabold text-emerald-800 pt-1 border-t border-emerald-200/60">
                <span>صافي قيمة التصفية اليوم:</span>
                <span>{{ netEarlySettlement }} ريال</span>
              </div>
            </div>
          </div>

          <!-- Action Button -->
          <button 
            @click="handlePayment" 
            :disabled="isProcessing"
            class="w-full bg-teal-600 hover:bg-teal-700 disabled:bg-slate-300 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex justify-center items-center gap-2"
          >
            <i v-if="isProcessing" class="fa-solid fa-circle-notch fa-spin"></i>
            <span>{{ isProcessing ? 'جاري توثيق الطلب...' : 'تأكيد ودفع الاستحقاق' }}</span>
          </button>
        </div>
      </template>

      <!-- Empty State -->
      <div v-else class="text-center py-10 bg-white rounded-2xl border text-slate-500 text-xs">
        لا توجد شرائح تمويل مضافة حالياً في قاعدة البيانات.
      </div>

    </main>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // Supabase Configuration
    const SUPABASE_URL = 'https://kdmlkhlceihidcmwdhxi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_G5uoFE-wczB6h1YeBAt__g_0ktNTptG';

    let supabaseClient = null;
    if (window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    createApp({
      setup() {
        const tiers = ref([]);
        const selectedTier = ref({});
        const isEarlySettlement = ref(false);
        const isProcessing = ref(false);
        const isLoading = ref(true);

        // تنسيق الأرقام بأمان لتجنب ظهور NaN
        const formatMoney = (val) => {
          const num = Number(val);
          return isNaN(num) ? '0.00' : num.toFixed(2);
        };

        // جلب الشرائح من Supabase
       const fetchTiersFromSupabase = async () => {
  isLoading.value = true;
  if (supabaseClient) {
    const { data, error } = await supabaseClient
      .from('user_loans')
      .select('*')
      .order('tier_amount', { ascending: true });

    if (error) {
      console.error('Error loading tiers:', error.message);
    } else if (data && data.length > 0) {
      tiers.value = data.map(item => {
        const amount = Number(item.tier_amount) || 0;
        const totalCost = Number(item.total_cost) || 0;
        const firstInst = Number(item.first_installment) || 0;
        
        // قراءة عدد الأشهر الديناميكي من قاعدة البيانات (مع افتراض 3 إذا لم تحدد)
        const months = Number(item.months_count) || 3;
        const remaining = totalCost - firstInst;
        const monthlyAmount = months > 0 ? (remaining / months).toFixed(2) : '0.00';

        return {
          amount: amount,
          totalCost: totalCost,
          firstInstallment: firstInst,
          monthsCount: months,
          // صياغة النص ديناميكياً بحسب عدد الأشهر المدخل في لوحة التحكم
          subsequentInstallments: `${monthlyAmount} ريال (${months} أشهر)`,
          earlyNet: amount * 1.3
        };
      });
      selectedTier.value = tiers.value[0];
    }
  }
  isLoading.value = false;
};
        const discountAmount = computed(() => {
          const total = Number(selectedTier.value.totalCost) || 0;
          const early = Number(selectedTier.value.earlyNet) || 0;
          return formatMoney(total - early);
        });

        const netEarlySettlement = computed(() => {
          return formatMoney(selectedTier.value.earlyNet);
        });

        const handlePayment = async () => {
          isProcessing.value = true;
          setTimeout(() => {
            isProcessing.value = false;
            alert(`تم تسجيل طلب السداد لشريحة ${selectedTier.value.amount} ريال بنجاح!`);
          }, 1200);
        };

        const installPWA = () => {
          alert("تطبيق الـ PWA جاهز! قم بالنقر على قائمة المتصفح واختيار 'إضافة إلى الشاشة الرئيسية'.");
        };

        onMounted(() => {
          fetchTiersFromSupabase();
        });

        return {
          tiers,
          selectedTier,
          isEarlySettlement,
          discountAmount,
          netEarlySettlement,
          isProcessing,
          isLoading,
          formatMoney,
          handlePayment,
          installPWA
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
