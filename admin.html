<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة منصة مُهْلَة الرقمية</title>
  <link rel="icon" type="image/jpeg" href="mohla.jpg">

  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vue 3 & Supabase JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Cairo', sans-serif; } 
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 pb-12">

  <div id="admin-app" class="max-w-6xl mx-auto space-y-6">

    <!-- 🔒 1. Login Screen -->
    <div v-if="!isAuthenticated" class="max-w-md mx-auto my-16 bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center space-y-6">
      <div class="w-16 h-16 bg-slate-900 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-xl font-extrabold text-slate-900">تسجيل دخول الإدارة</h2>
        <p class="text-xs text-slate-500 mt-1">يرجى إدخال بيانات حساب المسؤول للوصول للوحة التحكم</p>
      </div>

      <transition name="fade">
        <div v-if="toast.show" :class="['p-3 rounded-xl text-xs font-bold text-white flex items-center justify-between shadow', toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600']">
          <span>{{ toast.message }}</span>
          <button @click="toast.show = false"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </transition>

      <form @submit.prevent="handleLogin" class="space-y-4 text-right">
        <div>
          <label class="font-bold text-xs text-slate-600 block mb-1">البريد الإلكتروني</label>
          <input v-model="loginEmail" type="email" required placeholder="admin@mohla.sa" class="w-full p-3 text-xs border rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div>
          <label class="font-bold text-xs text-slate-600 block mb-1">كلمة المرور</label>
          <input v-model="loginPassword" type="password" required placeholder="••••••••" class="w-full p-3 text-xs border rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <button 
          type="submit" 
          :disabled="isLoggingIn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition-all shadow-md text-xs flex justify-center items-center gap-2"
        >
          <i v-if="isLoggingIn" class="fa-solid fa-circle-notch fa-spin"></i>
          <span>{{ isLoggingIn ? 'جاري التحقق...' : 'تسجيل الدخول' }}</span>
        </button>
      </form>
    </div>

    <!-- 📊 2. Main Admin Dashboard -->
    <template v-else>
      
      <!-- Header -->
      <header class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center shadow-md">
        <div>
          <h1 class="font-bold text-lg flex items-center gap-2">
            <i class="fa-solid fa-user-shield text-amber-400"></i>
            لوحة إدارة منصة مُهْلَة (Admin Dashboard)

        <div class="flex items-center gap-3">
          <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            متصل
          </span>
          <button @click="handleLogout" class="bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-rose-500/30 transition-all flex items-center gap-1">
            <i class="fa-solid fa-right-from-bracket"></i>
            خروج
          </button>
        </div>
      </header>

      <!-- Custom Confirmation Modal -->
      <div v-if="deleteModal.show" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">

          <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <div>
            <h3 class="text-base font-extrabold text-slate-900">تأكيد الحذف</h3>

          </div>
          <div class="flex gap-2 pt-2">
            <button @click="confirmDelete" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all text-xs shadow-md">

            <button @click="deleteModal.show = false" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-all text-xs">

      <!-- Notification Toast -->

        <div v-if="toast.show" :class="['p-3 rounded-xl text-xs font-bold text-white flex items-center justify-between shadow-md', toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600']">
          <span>{{ toast.message }}</span>
          <button @click="toast.show = false"><i class="fa-solid fa-xmark"></i></button>
        </div>

      <!-- Add / Edit Tier Form -->
      <div :class="['rounded-2xl p-5 shadow-sm border transition-all', isEditing ? 'bg-amber-50/50 border-amber-200' : 'bg-white border-slate-200']">

        </div>

          <form @submit.prevent="saveTier" class="space-y-4 text-xs bg-white p-5 rounded-2xl shadow-sm border border-slate-100">


  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="font-bold text-slate-700 block mb-1">مبلغ الشريحة الأساسي (ريال)</label>
      <input 
        v-model.number="form.tier_amount" 
        @input="!isEditing && (form.total_cost = form.tier_amount ? Number((form.tier_amount * 1.30).toFixed(2)) : '')" 
        type="number" 
        step="any" 
        required 
        placeholder="مثال: 2000 (أصل التمويل)" 
        class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all"
      >
      <span class="text-[10px] text-slate-400 mt-1 block">القيمة الأساسية للتمويل المطلوب.</span>
    </div>
    
    <div>
      <label class="font-bold text-slate-700 block mb-1">كلفة الأجل الإجمالية (ريال)</label>
      <input 
        v-model.number="form.total_cost" 
        type="number" 
        step="any" 
        required
        placeholder="مثال: 3162.5" 
        class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all"

  <div class="grid grid-cols-2 gap-4">

    <div>
      <label class="font-bold text-slate-700 block mb-1">التسوية المبكرة (الشهر الأول / يوم 27)</label>
      <input 
        v-model.number="form.early_settlement_first" 
        type="number" 
        step="any" 
        required 
        placeholder="مثال: 2600" 
        class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all"

      <span class="text-[10px] text-slate-400 mt-1 block">مبلغ السداد المبكر في حال سدد العميل مبكراً.</span>

  </div>

  <div class="grid grid-cols-3 gap-4">
    <div>
      <label class="font-bold text-slate-700 block mb-1">قيمة القسط الأول (الشهر 1)</label>
      <input 
        v-model.number="form.first_installment" 
        type="number" 
        step="any" 
        required 
        placeholder="مثال: 1350" 
        class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all"
      >
      <span class="text-[10px] text-slate-400 mt-1 block">المبلغ المستحق في الشهر الأول.</span>
    </div>

    <div>
      <label class="font-bold text-slate-700 block mb-1">تفاصيل الأقساط اللاحقة والدورية</label>
      <input 
        v-model="form.subsequent_installments_text" 
        type="text" 
        required 
        placeholder="مثال: 610.83 (لمدة 3 أشهر)" 
        class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all"
      >
      <span class="text-[10px] text-slate-400 mt-1 block">قيمة الأقساط للأشهر المتبقية.</span>
    </div>

    <div>
      <label class="font-bold text-slate-700 block mb-1">يوم الاستحقاق الافتراضي</label>
      <select v-model.number="form.due_day" required class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-600 outline-none transition-all text-xs font-bold text-slate-800">
        <option :value="27">يوم 27 (قطاع حكومي)</option>
        <option :value="1">يوم 1 (قطاع خاص / متقاعد)</option>
      </select>
      <span class="text-[10px] text-slate-400 mt-1 block">تاريخ سداد القسط الشهري.</span>
    </div>
  </div>

  <div class="flex gap-2 pt-3">
    <button type="submit" :disabled="isSubmitting" :class="['flex-1 text-white font-bold py-3 rounded-xl transition-all shadow flex justify-center items-center gap-2', isEditing ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-700 hover:bg-teal-800']">
      <i v-if="isSubmitting" class="fa-solid fa-circle-notch fa-spin"></i>
      <span>{{ isSubmitting ? 'جاري الحفظ...' : (isEditing ? 'حفظ التعديلات' : 'إضافة الشريحة لقاعدة البيانات') }}</span>
    </button>
    <button v-if="isEditing" type="button" @click="cancelEdit" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-3 rounded-xl transition-all">
      إلغاء
    </button>
  </div>
</form>
      </div>

      <!-- Active Tiers Table -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xs font-bold text-slate-700">الشرائح المسجلة حالياً في Supabase:</h3>
          <button @click="fetchTiers" class="text-xs text-teal-700 hover:underline font-bold flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> تحديث
          </button>
        </div>

        <div v-if="isLoadingTiers" class="text-center py-6 text-xs text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-lg block mb-2 text-teal-600"></i> جاري جلب الشرائح...
        </div>

        <div v-else-if="tiers.length === 0" class="text-center py-6 text-xs text-slate-400 border border-dashed rounded-xl">
          لا توجد شرائح مسجلة حالياً.
        </div>

        <div v-else class="divide-y text-xs">
        <div v-for="t in tiers" :key="t.id" class="py-3 px-4 mb-2 bg-white border border-slate-100 rounded-xl shadow-sm flex justify-between items-center">
  <div>
    <div class="flex items-center gap-2 mb-1">
      <span class="font-extrabold text-teal-800 text-sm">{{ t.tier_amount }} ريال</span>
      <span class="bg-teal-50 text-teal-700 text-[10px] font-bold px-2 py-0.5 rounded-md border border-teal-200">
        {{ t.payment_path || 'مسار عام' }}
      </span>
    </div>
    <div class="text-slate-500 text-xs space-x-reverse space-x-2">
      <span>الإجمالي: <strong class="text-slate-700">{{ t.total_cost }} ريال</strong></span>
      <span>|</span>
      <span>التسوية المبكرة: <strong class="text-slate-700">{{ t.early_settlement_first }} ريال</strong></span>
      <span>|</span>
      <span>القسط الأول: <strong class="text-slate-700">{{ t.first_installment }} ريال</strong></span>
      <span>|</span>
      <span>الأقساط: <strong class="text-slate-700">{{ t.subsequent_installments_text }}</strong></span>
    </div>
  </div>

  <div class="flex gap-2">
    <button @click="editTier(t)" class="text-amber-700 font-bold bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg border border-amber-200 transition-all text-xs flex items-center gap-1">
      <i class="fa-solid fa-pen-to-square"></i> تعديل
    </button>
    <button @click="deleteTier(t.id)" class="text-rose-600 font-bold bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all text-xs">
      حذف
    </button>
  </div>
</div>
        </div>
      </div>

      <!-- Customer Loan Requests Section (Updated with client details & files) -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xs font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-clipboard-list text-teal-600"></i>
            طلبات التمويل الواردة من العملاء (متابعة البيانات والمستندات):
          </h3>
          <button @click="fetchLoanRequests" class="text-xs text-teal-700 hover:underline font-bold flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> تحديث الطلبات
          </button>
        </div>

        <div v-if="isLoadingRequests" class="text-center py-6 text-xs text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-lg block mb-2 text-teal-600"></i> جاري جلب الطلبات...
        </div>

        <div v-else-if="loanRequests.length === 0" class="text-center py-6 text-xs text-slate-400 border border-dashed rounded-xl">
          لا توجد طلبات تمويل واردة حتى الآن.
        </div>

        <div v-else class="overflow-x-auto">
          <table class="w-full text-right text-xs border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-600 border-b">
                <th class="p-2.5">رقم الطلب</th>
                <th class="p-2.5">الشريحة</th>
                <th class="p-2.5">خيار السداد و المسار</th>
                <th class="p-2.5">القطاع</th>
                <th class="p-2.5">بيانات العميل</th>
                <th class="p-2.5">الإجمالي</th>
                <th class="p-2.5">حالة الطلب</th>
                <th class="p-2.5">التاريخ والوقت</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr v-for="req in loanRequests" :key="req.id" class="hover:bg-slate-50/80">
                <td class="p-2.5 font-bold text-teal-800">#{{ req.id }}</td>
                <td class="p-2.5 font-bold">{{ req.tier_amount }} ريال</td>
                <td class="p-2.5 font-bold">{{ req.payment_path }} </td>
                <td class="p-2.5">
                  <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold">
                    {{ req.employment_sector === 'governmental' ? 'حكومي' : 'خاص' }}
                  </span>
                </td>
                <td class="p-2.5 space-y-0.5">
                  <div class="font-bold text-slate-900">هوية: {{ req.national_id || 'غير متوفر' }}</div>
                  <div class="text-[10px] text-slate-500">جوال: {{ req.phone || 'غير متوفر' }} | مدينة: {{ req.city || '-' }}</div>
                </td>
             
                <td class="p-2.5 font-extrabold text-slate-800">{{ req.total_cost }} ريال</td>
                <td class="p-2.5">
                  <select 
                    v-model="req.status" 
                    @change="updateStatus(req.id, req.status)"
                    :class="[
                      'w-full p-1.5 rounded-xl font-extrabold text-[11px] border cursor-pointer focus:outline-none',
                      req.status === 'approved' ? 'bg-emerald-50 text-emerald-700 border-emerald-300' : 
                      (req.status === 'rejected' ? 'bg-rose-50 text-rose-700 border-rose-300' : 'bg-amber-50 text-amber-700 border-amber-300')
                    ]"
                  >
                    <option value="pending">⏳ pending (قيد الانتظار)</option>
                    <option value="approved">✅ approved (موافق عليه)</option>
                    <option value="rejected">❌ rejected (مرفوض)</option>
                  </select>
                </td>
                <td class="p-2.5 text-slate-400 text-[10px]">{{ new Date(req.created_at).toLocaleString('ar-SA') }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </template>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const SUPABASE_URL = 'https://kdmlkhlceihidcmwdhxi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_G5uoFE-wczB6h1YeBAt__g_0ktNTptG';

    let supabaseClient = null;
    if (window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    createApp({
      setup() {
        const isAuthenticated = ref(false);
        const isLoggingIn = ref(false);
        const loginEmail = ref('');
        const loginPassword = ref('');
        const userEmail = ref('');
        const deleteModal = ref({ show: false, id: null });

        const tiers = ref([]);
        const loanRequests = ref([]);
        const isLoadingTiers = ref(true);
        const isLoadingRequests = ref(true);
        const isSubmitting = ref(false);
        const isEditing = ref(false);
        const editingId = ref(null);
        const toast = ref({ show: false, message: '', type: 'success' });

        const form = ref({
          tier_amount: null,
          total_cost: null,
          first_installment: null,
          months_count: 3,
          due_day: 27
        });

        const showNotification = (msg, type = 'success') => {
          toast.value = { show: true, message: msg, type };
          setTimeout(() => { toast.value.show = false; }, 3500);
        };

        const checkSession = async () => {
          if (supabaseClient) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
              isAuthenticated.value = true;
              userEmail.value = session.user.email;
              await fetchTiers();
              await fetchLoanRequests();
            } else {
              isAuthenticated.value = false;
            }
          }
        };

        const handleLogin = async () => {
          isLoggingIn.value = true;
          if (supabaseClient) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: loginEmail.value,
              password: loginPassword.value
            });

            if (error) {
              showNotification('خطأ في تسجيل الدخول: ' + error.message, 'error');
            } else {
              isAuthenticated.value = true;
              userEmail.value = data.user.email;
              showNotification('تم تسجيل الدخول بنجاح 👋', 'success');
              await fetchTiers();
              await fetchLoanRequests();
            }
          }
          isLoggingIn.value = false;
        };

        const handleLogout = async () => {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
            isAuthenticated.value = false;
            loginEmail.value = '';
            loginPassword.value = '';
            showNotification('تم تسجيل الخروج بنجاح', 'success');
          }
        };
const fetchTiers = async () => {
  isLoadingTiers.value = true; // بدء التحميل وإظهار أيقونة الدوران
  try {
    if (supabaseClient) {
      const { data, error } = await supabaseClient
        .from('user_loans')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('Error fetching tiers:', error.message);
        showNotification('خطأ في جلب الشرائح: ' + error.message, 'error');
      } else {
        tiers.value = data || [];
      }
    }
  } catch (err) {
    console.error('Unexpected error:', err);
  } finally {
    isLoadingTiers.value = false; // إيقاف التحميل في كلتا الحالتين (نجاح أو خطأ)
  }
};

      const fetchLoanRequests = async () => {
          isLoadingRequests.value = true;
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('loan_requests')
              .select('*')
              .order('created_at', { ascending: false });

            if (!error && data) {
              const localData = JSON.parse(localStorage.getItem('mohla_client_details') || '{}');
              loanRequests.value = data.map(req => ({
                ...req,
                national_id: req.national_id || (localData[req.id] ? localData[req.id].national_id : null),
                phone: req.phone || (localData[req.id] ? localData[req.id].phone : null),
                city: req.city || (localData[req.id] ? localData[req.id].city : null),
                salary_doc_url: req.salary_doc_url || (localData[req.id] ? localData[req.id].salary_doc_url : null),
                simah_doc_url: req.simah_doc_url || (localData[req.id] ? localData[req.id].simah_doc_url : null)
              }));
            }
          }
          isLoadingRequests.value = false;
        };


        const updateStatus = async (id, newStatus) => {
          if (supabaseClient) {
            const { error } = await supabaseClient
              .from('loan_requests')
              .update({ status: newStatus })
              .eq('id', id);

            if (error) {
              showNotification('خطأ أثناء تحديث الحالة: ' + error.message, 'error');
            } else {
              showNotification('✨ تم تحديث حالة الطلب بنجاح!', 'success');
              await fetchLoanRequests();
            }
          }
        };

        const editTier = (tier) => {
  isEditing.value = true;
  editingId.value = tier.id;
  
  // تعبئة نموذج التعديل بالبيانات الحالية للشريحة مع مطابقة أسماء الأعمدة
  form.value = {
    tier_amount: tier.tier_amount,
    total_cost: tier.total_cost,
    payment_path: tier.payment_path || '',
    early_settlement_first: tier.early_settlement_first,
    first_installment: tier.first_installment,
    subsequent_installments_text: tier.subsequent_installments_text || '',
    due_day: tier.due_day || 27
  };
  
  // التمرير بسلاسة إلى أعلى الفورم ليرى المستخدم حقول التعديل
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

        const cancelEdit = () => {
          isEditing.value = false;
          editingId.value = null;
          form.value = { tier_amount: null, total_cost: null, first_installment: null, months_count: 3, due_day: 27 };
        };

      const saveTier = async () => {
  isSubmitting.value = true;
  
  if (supabaseClient) {
    const payload = {
      tier_amount: form.value.tier_amount,
      total_cost: form.value.total_cost,
      payment_path: form.value.payment_path,
      early_settlement_first: form.value.early_settlement_first,
      first_installment: form.value.first_installment,
      subsequent_installments_text: form.value.subsequent_installments_text,
      due_day: form.value.due_day
    };

    if (isEditing.value) {
      const { error } = await supabaseClient.from('user_loans').update(payload).eq('id', editingId.value);
      if (error) showNotification('خطأ أثناء التعديل: ' + error.message, 'error');
      else { showNotification('✨ تم تحديث الشريحة بنجاح!', 'success'); cancelEdit(); await fetchTiers(); }
    } else {
      const { error } = await supabaseClient.from('user_loans').insert([payload]);
      if (error) showNotification('خطأ أثناء الإضافة: ' + error.message, 'error');
      else { 
        showNotification('🎉 تمت إضافة الشريحة بنجاح!', 'success'); 
        form.value = { tier_amount: null, total_cost: null, payment_path: '', early_settlement_first: null, first_installment: null, subsequent_installments_text: '', due_day: 27 }; 
        await fetchTiers(); 
      }
    }
  }
  isSubmitting.value = false;
};

const deleteTier = (id) => { deleteModal.value = { show: true, id: id }; };

        const confirmDelete = async () => {
          const id = deleteModal.value.id;
          deleteModal.value.show = false;
          if (supabaseClient) {
            const { error } = await supabaseClient.from('user_loans').delete().eq('id', id);
            if (error) showNotification('خطأ في الحذف: ' + error.message, 'error');
            else { showNotification('🗑️ تم حذف الشريحة بنجاح', 'success'); await fetchTiers(); }
          }
        };

        onMounted(() => { checkSession(); });

        return {
          isAuthenticated, isLoggingIn, loginEmail, loginPassword, userEmail,
          handleLogin, handleLogout, tiers, loanRequests, form,
          isLoadingTiers, isLoadingRequests, isSubmitting, isEditing, toast,
          saveTier, editTier, cancelEdit, deleteTier, fetchTiers, fetchLoanRequests,
          updateStatus, deleteModal, confirmDelete
        };
      }
    }).mount('#admin-app');
  </script>
</body>
</html>
