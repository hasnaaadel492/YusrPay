<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة منصة مُهْلَة الرقمية</title>
  
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Vue 3 & Supabase JS -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Cairo', sans-serif; } 
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 pb-12">

  <div id="admin-app" class="max-w-5xl mx-auto space-y-6">

    <!-- 🔒 1. Login Screen (تظهر في حال عدم تسجيل الدخول) -->
    <div v-if="!isAuthenticated" class="max-w-md mx-auto my-16 bg-white rounded-3xl p-8 shadow-xl border border-slate-200 text-center space-y-6">
      <div class="w-16 h-16 bg-slate-900 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h2 class="text-xl font-extrabold text-slate-900">تسجيل دخول الإدارة</h2>
        <p class="text-xs text-slate-500 mt-1">يرجى إدخال بيانات حساب المسؤول للوصول للوحة التحكم</p>
      </div>

      <!-- Notification Toast inside Login -->
      <transition name="fade">
        <div v-if="toast.show" :class="['p-3 rounded-xl text-xs font-bold text-white flex items-center justify-between shadow', toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600']">
          <span>{{ toast.message }}</span>
          <button @click="toast.show = false"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </transition>

      <form @submit.prevent="handleLogin" class="space-y-4 text-right">
        <div>
          <label class="font-bold text-xs text-slate-600 block mb-1">البريد الإلكتروني</label>
          <input v-model="loginEmail" type="email" required placeholder="admin@mohla.sa" class="w-full p-3 text-xs border rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>
        <div>
          <label class="font-bold text-xs text-slate-600 block mb-1">كلمة المرور</label>
          <input v-model="loginPassword" type="password" required placeholder="••••••••" class="w-full p-3 text-xs border rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <button 
          type="submit" 
          :disabled="isLoggingIn"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition-all shadow-md text-xs flex justify-center items-center gap-2"
        >
          <i v-if="isLoggingIn" class="fa-solid fa-circle-notch fa-spin"></i>
          <span>{{ isLoggingIn ? 'جاري التحقق...' : 'تسجيل الدخول' }}</span>
        </button>
      </form>
    </div>

    <!-- 📊 2. Main Admin Dashboard (تظهر فقط عند تسجيل الدخول بنجاح) -->
    <template v-else>
      
      <!-- Header -->
      <header class="bg-slate-900 text-white p-4 rounded-2xl flex justify-between items-center shadow-md">
        <div>
          <h1 class="font-bold text-lg flex items-center gap-2">
            <i class="fa-solid fa-user-shield text-amber-400"></i>
            لوحة إدارة منصة مُهْلَة (Admin Dashboard)
          </h1>
          <p class="text-xs text-slate-400">مرحباً {{ userEmail }} - إدارة الشرائح ومتابعة طلبات العملاء وسندات نافذ</p>
        </div>
        <div class="flex items-center gap-3">
          <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-500/30 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            متصل
          </span>
          <button @click="handleLogout" class="bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-rose-500/30 transition-all flex items-center gap-1">
            <i class="fa-solid fa-right-from-bracket"></i>
            خروج
          </button>
        </div>
      </header>
      <!-- Custom Confirmation Modal -->
<div v-if="deleteModal.show" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 text-center space-y-4 animate-fade-in">
    <div class="w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <div>
      <h3 class="text-base font-extrabold text-slate-900">تأكيد الحذف</h3>
      <p class="text-xs text-slate-500 mt-1">هل أنت متأكد من حذف هذه الشريحة نهائياً؟ لا يمكن التراجع عن هذا الإجراء.</p>
    </div>
    <div class="flex gap-2 pt-2">
      <button 
        @click="confirmDelete" 
        class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all text-xs shadow-md shadow-rose-600/20"
      >
        نعم، احذف
      </button>
      <button 
        @click="deleteModal.show = false" 
        class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-all text-xs"
      >
        إلغاء
      </button>
    </div>
  </div>
</div>

      <!-- Notification Toast -->
      <transition name="fade">
        <div v-if="toast.show" :class="['p-3 rounded-xl text-xs font-bold text-white flex items-center justify-between shadow-md', toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600']">
          <span>{{ toast.message }}</span>
          <button @click="toast.show = false"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </transition>

      <!-- Add / Edit Tier Form -->
      <div :class="['rounded-2xl p-5 shadow-sm border transition-all', isEditing ? 'bg-amber-50/50 border-amber-200' : 'bg-white border-slate-200']">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-sm font-bold flex items-center gap-2" :class="isEditing ? 'text-amber-700' : 'text-slate-800'">
            <i :class="['fa-solid', isEditing ? 'fa-pen-to-square text-amber-600' : 'fa-plus-circle text-teal-600']"></i>
            <span>{{ isEditing ? 'تعديل شريحة التمويل المحددة' : 'إضافة شريحة تمويل جديدة' }}</span>
          </h2>
          <span v-if="isEditing" class="text-[10px] bg-amber-200 text-amber-800 font-bold px-2.5 py-0.5 rounded-full">
            جاري التعديل الآن
          </span>
        </div>

        <form @submit.prevent="saveTier" class="space-y-4 text-xs">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="font-bold text-slate-600 block mb-1">مبلغ الشريحة (ريال)</label>
              <input v-model.number="form.tier_amount" type="number" step="any" required placeholder="مثال: 2000" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white">
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">كلفة الآجل الإجمالية</label>
              <input v-model.number="form.total_cost" type="number" step="any" required placeholder="مثال: 3162.5" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="font-bold text-slate-600 block mb-1">القسط الأول</label>
              <input v-model.number="form.first_installment" type="number" step="any" required placeholder="مثال: 1350" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white">
            </div>
            <div>
              <label class="font-bold text-slate-600 block mb-1">عدد أشهر الأقساط اللاحقة</label>
              <input v-model.number="form.months_count" type="number" min="1" required placeholder="مثال: 3" class="w-full p-2.5 border rounded-xl bg-slate-50 focus:bg-white">
            </div>
       <div>
  <label class="font-bold text-slate-600 block mb-1">يوم الاستحقاق الافتراضي</label>
  <div class="relative">
    <select 
      v-model.number="form.due_day" 
      required 
      class="w-full p-2.5 px-3 border border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600 appearance-none text-xs font-bold text-slate-800 transition-all cursor-pointer shadow-sm"
    >
      <option :value="27">يوم 27 (قطاع حكومي)</option>
      <option :value="1">يوم 1 (قطاع خاص / متقاعد)</option>
    </select>
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-slate-400">
      <i class="fa-solid fa-chevron-down text-xs"></i>
    </div>
  </div>
</div>
          </div>

          <div class="flex gap-2 pt-2">
            <button 
              type="submit" 
              :disabled="isSubmitting"
              :class="['flex-1 text-white font-bold py-3 rounded-xl transition-all shadow flex justify-center items-center gap-2', isEditing ? 'bg-amber-600 hover:bg-amber-700' : 'bg-teal-700 hover:bg-teal-800']"
            >
              <i v-if="isSubmitting" class="fa-solid fa-circle-notch fa-spin"></i>
              <span>{{ isSubmitting ? 'جاري الحفظ...' : (isEditing ? 'حفظ التعديلات' : 'إضافة الشريحة لقاعدة البيانات') }}</span>
            </button>
            
            <button 
              v-if="isEditing" 
              type="button" 
              @click="cancelEdit"
              class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-3 rounded-xl transition-all"
            >
              إلغاء التعديل
            </button>
          </div>
        </form>
      </div>

      <!-- Active Tiers Table -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xs font-bold text-slate-700">الشرائح المسجلة حالياً في Supabase:</h3>
          <button @click="fetchTiers" class="text-xs text-teal-700 hover:underline font-bold flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> تحديث
          </button>
        </div>

        <div v-if="isLoadingTiers" class="text-center py-6 text-xs text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-lg block mb-2 text-teal-600"></i>
          جاري جلب الشرائح...
        </div>

        <div v-else-if="tiers.length === 0" class="text-center py-6 text-xs text-slate-400 border border-dashed rounded-xl">
          لا توجد شرائح مسجلة حالياً.
        </div>

        <div v-else class="divide-y text-xs">
          <div v-for="t in tiers" :key="t.id" class="py-3 flex justify-between items-center">
            <div>
              <span class="font-extrabold text-teal-800 text-base ml-2">{{ t.tier_amount }} ريال</span>
              <span class="text-slate-500 text-xs">
                | الإجمالي: {{ t.total_cost }} ريال | القسط الأول: {{ t.first_installment }} ريال | الأقساط: {{ t.months_count || 3 }} أشهر
              </span>
            </div>
            <div class="flex gap-2">
              <button @click="editTier(t)" class="text-amber-700 font-bold bg-amber-50 hover:bg-amber-100 px-3 py-1.5 rounded-lg transition-all border border-amber-200">
                <i class="fa-solid fa-pen-to-square ml-1"></i> تعديل
              </button>
              <button @click="deleteTier(t.id)" class="text-rose-600 font-bold bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all">
                حذف
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Customer Loan Requests Section -->
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xs font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-solid fa-clipboard-list text-teal-600"></i>
            طلبات التمويل الواردة من العملاء (متابعة السندات وعربون الجدية):
          </h3>
          <button @click="fetchLoanRequests" class="text-xs text-teal-700 hover:underline font-bold flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> تحديث الطلبات
          </button>
        </div>

        <div v-if="isLoadingRequests" class="text-center py-6 text-xs text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-lg block mb-2 text-teal-600"></i>
          جاري جلب الطلبات...
        </div>

        <div v-else-if="loanRequests.length === 0" class="text-center py-6 text-xs text-slate-400 border border-dashed rounded-xl">
          لا توجد طلبات تمويل واردة حتى الآن.
        </div>

        <div v-else class="overflow-x-auto">
          <table class="w-full text-right text-xs border-collapse">
            <thead>
              <tr class="bg-slate-50 text-slate-600 border-b">
                <th class="p-2.5">رقم الطلب</th>
                <th class="p-2.5">الشريحة</th>
                <th class="p-2.5">قطاع التوظيف</th>
                <th class="p-2.5">عربون (14 ريال)</th>
                <th class="p-2.5">إجمالي التمويل</th>
                <th class="p-2.5">السداد المبكر</th>
                <th class="p-2.5">حالة الطلب / نافذ</th>
                <th class="p-2.5">التاريخ والوقت</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr v-for="req in loanRequests" :key="req.id" class="hover:bg-slate-50/80">
                <td class="p-2.5 font-bold text-teal-800">#{{ req.id }}</td>
                <td class="p-2.5 font-bold">{{ req.tier_amount }} ريال</td>
                <td class="p-2.5">
                  <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold">
                    {{ req.employment_sector === 'governmental' ? 'حكومي (27)' : (req.employment_sector === 'private' ? 'خاص (1)' : 'متقاعد (1)') }}
                  </span>
                </td>
                <td class="p-2.5">
                  <span :class="['px-2 py-0.5 rounded-full font-bold', req.serious_fee_paid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800']">
                    {{ req.serious_fee_paid ? 'مدفوع (14ر.س)' : 'غير مدفوع' }}
                  </span>
                </td>
                <td class="p-2.5 font-extrabold text-slate-800">{{ req.total_cost }} ريال</td>
                <td class="p-2.5">
                  <span :class="['px-2 py-0.5 rounded-full text-[10px] font-bold', req.is_early_settlement ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600']">
                    {{ req.is_early_settlement ? 'مفعل (إسقاط الأرباح)' : 'لا' }}
                  </span>
                </td>
           <td class="p-2.5">
  <div class="relative inline-block w-full min-w-[140px]">
    <select 
      v-model="req.status" 
      @change="updateStatus(req.id, req.status)"
      :class="[
        'w-full pl-7 pr-3 py-1.5 rounded-xl font-extrabold text-[11px] border appearance-none cursor-pointer focus:outline-none focus:ring-2 transition-all shadow-sm',
        req.status === 'approved' ? 'bg-emerald-50 text-emerald-700 border-emerald-300 focus:ring-emerald-400' : 
        (req.status === 'rejected' ? 'bg-rose-50 text-rose-700 border-rose-300 focus:ring-rose-400' : 'bg-amber-50 text-amber-700 border-amber-300 focus:ring-amber-400')
      ]"
    >
      <option value="pending" class="bg-white text-amber-700 font-bold">⏳ pending (قيد الانتظار)</option>
      <option value="approved" class="bg-white text-emerald-700 font-bold">✅ approved (تم إصدار نافذ)</option>
      <option value="rejected" class="bg-white text-rose-700 font-bold">❌ rejected (مرفوض)</option>
    </select>
    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-2 text-slate-400">
      <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
  </div>
</td>
                <td class="p-2.5 text-slate-400 text-[11px]">{{ new Date(req.created_at).toLocaleString('ar-SA') }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </template>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const SUPABASE_URL = 'https://kdmlkhlceihidcmwdhxi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_G5uoFE-wczB6h1YeBAt__g_0ktNTptG';

    let supabaseClient = null;
    if (window.supabase && window.supabase.createClient) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    createApp({
      setup() {
        // Auth states
        const isAuthenticated = ref(false);
        const isLoggingIn = ref(false);
        const loginEmail = ref('');
        const loginPassword = ref('');
        const userEmail = ref('');
        const deleteModal = ref({ show: false, id: null });

        // App states
        const tiers = ref([]);
        const loanRequests = ref([]);
        const isLoadingTiers = ref(true);
        const isLoadingRequests = ref(true);
        const isSubmitting = ref(false);
        const isEditing = ref(false);
        const editingId = ref(null);
        const toast = ref({ show: false, message: '', type: 'success' });

        const form = ref({
          tier_amount: null,
          total_cost: null,
          first_installment: null,
          months_count: 3,
          due_day: 27
        });

        const showNotification = (msg, type = 'success') => {
          toast.value = { show: true, message: msg, type };
          setTimeout(() => { toast.value.show = false; }, 3500);
        };

        // Check active Session
        const checkSession = async () => {
          if (supabaseClient) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
              isAuthenticated.value = true;
              userEmail.value = session.user.email;
              await fetchTiers();
              await fetchLoanRequests();
            } else {
              isAuthenticated.value = false;
            }
          }
        };

        // Handle Login
        const handleLogin = async () => {
          isLoggingIn.value = true;
          if (supabaseClient) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
              email: loginEmail.value,
              password: loginPassword.value
            });

            if (error) {
              showNotification('خطأ في تسجيل الدخول: ' + error.message, 'error');
            } else {
              isAuthenticated.value = true;
              userEmail.value = data.user.email;
              showNotification('تم تسجيل الدخول بنجاح 👋', 'success');
              await fetchTiers();
              await fetchLoanRequests();
            }
          }
          isLoggingIn.value = false;
        };

        // Handle Logout
        const handleLogout = async () => {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
            isAuthenticated.value = false;
            loginEmail.value = '';
            loginPassword.value = '';
            showNotification('تم تسجيل الخروج بنجاح', 'success');
          }
        };

        const fetchTiers = async () => {
          isLoadingTiers.value = true;
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('user_loans')
              .select('*')
              .order('tier_amount', { ascending: true });

            if (!error && data) {
              tiers.value = data;
            }
          }
          isLoadingTiers.value = false;
        };

        const fetchLoanRequests = async () => {
          isLoadingRequests.value = true;
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('loan_requests')
              .select('*')
              .order('created_at', { ascending: false });

            if (!error && data) {
              loanRequests.value = data;
            }
          }
          isLoadingRequests.value = false;
        };

        const updateStatus = async (id, newStatus) => {
          if (supabaseClient) {
            const { error } = await supabaseClient
              .from('loan_requests')
              .update({ status: newStatus })
              .eq('id', id);

            if (error) {
              showNotification('خطأ أثناء تحديث الحالة: ' + error.message, 'error');
            } else {
              showNotification('✨ تم تحديث حالة الطلب بنجاح!', 'success');
              await fetchLoanRequests();
            }
          }
        };

        const editTier = (item) => {
          isEditing.value = true;
          editingId.value = item.id;
          form.value = {
            tier_amount: item.tier_amount,
            total_cost: item.total_cost,
            first_installment: item.first_installment,
            months_count: item.months_count || 3,
            due_day: item.due_day || 27
          };
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const cancelEdit = () => {
          isEditing.value = false;
          editingId.value = null;
          form.value = { tier_amount: null, total_cost: null, first_installment: null, months_count: 3, due_day: 27 };
        };

      const saveTier = async () => {
  // التحقق من عدم تكرار مبلغ الشريحة عند الإضافة الجديدة
  if (!isEditing.value) {
    const exists = tiers.value.some(t => t.tier_amount === form.value.tier_amount);
    if (exists) {
      showNotification('⚠️ هذه الشريحة موجودة مسبقاً! يرجى تعديلها بدلاً من إضافتها مجدداً.', 'error');
      return;
    }
  }

  isSubmitting.value = true;
  if (supabaseClient) {
    const payload = {
      tier_amount: form.value.tier_amount,
      total_cost: form.value.total_cost,
      first_installment: form.value.first_installment,
      months_count: form.value.months_count,
      due_day: form.value.due_day
    };

    if (isEditing.value) {
      const { error } = await supabaseClient
        .from('user_loans')
        .update(payload)
        .eq('id', editingId.value);

      if (error) {
        showNotification('خطأ أثناء التعديل: ' + error.message, 'error');
      } else {
        showNotification('✨ تم تحديث الشريحة بنجاح!', 'success');
        cancelEdit();
        await fetchTiers();
      }
    } else {
      const { error } = await supabaseClient
        .from('user_loans')
        .insert([payload]);

      if (error) {
        showNotification('خطأ أثناء الإضافة: ' + error.message, 'error');
      } else {
        showNotification('🎉 تمت إضافة الشريحة بنجاح!', 'success');
        form.value = { tier_amount: null, total_cost: null, first_installment: null, months_count: 3, due_day: 27 };
        await fetchTiers();
      }
    }
  }
  isSubmitting.value = false;
};

       // استبدل دالة deleteTier القديمة بهذا الكود
const deleteTier = (id) => {
  deleteModal.value = { show: true, id: id };
};

const confirmDelete = async () => {
  const id = deleteModal.value.id;
  deleteModal.value.show = false;

  if (supabaseClient) {
    const { error } = await supabaseClient
      .from('user_loans')
      .delete()
      .eq('id', id);

    if (error) {
      showNotification('خطأ في الحذف: ' + error.message, 'error');
    } else {
      showNotification('🗑️ تم حذف الشريحة بنجاح', 'success');
      await fetchTiers();
    }
  }
};
        onMounted(() => {
          checkSession();
        });

        return {
          isAuthenticated,
          isLoggingIn,
          loginEmail,
          loginPassword,
          userEmail,
          handleLogin,
          handleLogout,
          tiers,
          loanRequests,
          form,
          isLoadingTiers,
          isLoadingRequests,
          isSubmitting,
          isEditing,
          toast,
          saveTier,
          editTier,
          cancelEdit,
          deleteTier,
          fetchTiers,
          fetchLoanRequests,
          updateStatus,
          deleteModal,
          confirmDelete
        };
      }
    }).mount('#admin-app');
  </script>
